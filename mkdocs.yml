site_name: Апофеосиз
site_description: Дизайн-документ и техническая документация Arcane SS14 - Apotheosis
site_author: Apotheosis Team
site_url: https://vecortys.github.io/apotheosis-docs/
repo_name: Vecortys/apotheosis-docs
repo_url: https://github.com/Vecortys/apotheosis-docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: ru
  custom_dir: overrides
  icon:
    logo: material/castle
  font:
    text: Merriweather Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Зажечь свечи
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Погасить свечи
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - search:
      lang:
        - ru
        - en
  - tags
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: На этой странице
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js

extra:
  status:
    draft: Черновик
    review: На проверке
    approved: Утверждено
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Vecortys/apotheosis-docs
      name: Репозиторий проекта
  generator: false

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

copyright: >-
  <span class="footer-mark">APOTHEOSIS</span> · Документация проекта ·
  <a href="https://github.com/Vecortys/apotheosis-docs">Предложить изменение</a>

nav:
  - Главная: index.md
  - Проект:
      - project/index.md
      - Видение: project/vision.md
      - Принципы игрового дизайна: project/pillars.md
      - Словарь: project/glossary.md
  - Дизайн-документ:
      - gdd/index.md
      - Игровой цикл: gdd/core-loop.md
      - Мир и сеттинг: gdd/world.md
      - Бой: gdd/combat.md
      - Роли и расы: gdd/roles.md
      - Интерфейс: gdd/ux.md
  - Разработка:
      - development/index.md
      - Архитектура: development/architecture.md
      - Контент-пайплайн: development/content-pipeline.md
      - Стандарты: development/standards.md
  - Производство:
      - production/index.md
      - Дорожная карта: production/roadmap.md
      - Журнал решений: production/decisions.md
  - Участие:
      - contributing/index.md
      - Как писать документацию: contributing/writing.md
      - Шаблоны:
          - Фича: contributing/templates/feature.md
          - Роль: contributing/templates/role.md
          - Архитектурное решение: contributing/templates/adr.md
